<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Water Ripple + Delayed Electric Shock</title>

<style>
    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;

        /*
         * NORMAL WINDOWS MOUSE
         */
        cursor: default;

        /*
         * Dark subtle background.
         */
        background:
            radial-gradient(
                circle at 50% 50%,
                #18212a 0%,
                #0b1016 45%,
                #030507 100%
            );
    }

    canvas {
        position: fixed;
        inset: 0;

        width: 100%;
        height: 100%;

        pointer-events: none;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

/* =========================================================
   CANVAS SETUP & HIGH-DPI SUB-PIXEL RENDERING (16x AA)
   ========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let width = 0;
let height = 0;
let dpr = 1;


/* =========================================================
   ACTIVE EFFECTS
   ========================================================= */

const effects = [];


/* =========================================================
   WATER SETTINGS (CLEAN & BALANCED RIPPLE COUNT)
   ========================================================= */

/*
 * Small localized radius.
 */
const WATER_RADIUS = 105;


/*
 * SLOW water wave.
 */
const WAVE_SPEED = 0.072;


/*
 * Reduced to exactly 3 prominent concentric water waves.
 */
const WAVE_COUNT = 3;


/*
 * Wider, well-spaced distance between wave crests.
 */
const WAVE_DISTANCE = 25;


/*
 * Water remains naturally visible for
 * roughly 2.3 seconds.
 */
const WATER_LIFETIME = 2300;


/*
 * Once the water is COMPLETELY gone,
 * wait another 1.8 seconds before
 * the electrical event.
 */
const SHOCK_DELAY = 1800;


/*
 * Electric event duration.
 */
const SHOCK_DURATION = 850;


/*
 * Directional overhead light angle for vivid highlights.
 */
const LIGHT_ANGLE = -Math.PI * 0.55;


/* =========================================================
   RESIZE & 16X SUPERSAMPLING CONFIGURATION
   ========================================================= */

function resize() {
    /*
     * Enforce a minimum 4x physical backing store scale
     * (4x width * 4x height = 16x pixel density / sub-pixel anti-aliasing)
     */
    const baseDpr = window.devicePixelRatio || 1;
    dpr = Math.max(baseDpr, 4);

    width =
        window.innerWidth;

    height =
        window.innerHeight;


    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    /* Enable high-quality sub-pixel image smoothing */
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
}


window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   HELPERS
   ========================================================= */

function random(min, max) {

    return (
        Math.random() *
        (max - min) +
        min
    );
}


function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );
}


function smoothstep(
    a,
    b,
    x
) {

    const t =
        clamp(
            (x - a) /
            (b - a),
            0,
            1
        );

    return (
        t *
        t *
        (3 - 2 * t)
    );
}


/* =========================================================
   MOUSE CLICK
   ========================================================= */

window.addEventListener(
    "mousedown",
    function(event) {

        createEffect(
            event.clientX,
            event.clientY
        );

    }
);


/* =========================================================
   CREATE WATER EVENT
   ========================================================= */

function createEffect(
    x,
    y
) {

    const effect = {

        x,
        y,

        /*
         * Time elapsed since click.
         */
        age: 0,

        /*
         * Slight random energy variation.
         */
        strength:
            random(
                0.95,
                1.05
            ),

        /*
         * Organic distortion points.
         */
        distortion: [],

        /*
         * Delayed shock state.
         */
        shockStarted: false,

        shockAge: 0,

        /*
         * Starting position of electrical
         * activity around perimeter.
         */
        shockOrigin:
            random(
                0,
                Math.PI * 2
            )
    };


    for (
        let i = 0;
        i < 240;
        i++
    ) {

        effect.distortion.push({

            phase:
                random(
                    0,
                    Math.PI * 2
                ),

            strength:
                random(
                    0.2,
                    0.8
                ),

            frequency:
                Math.floor(
                    random(2, 5)
                )
        });
    }


    effects.push(effect);


    while (
        effects.length > 5
    ) {

        effects.shift();

    }
}


/* =========================================================
   WATER WAVE PHYSICS
   ========================================================= */

function waterDisplacement(
    radius,
    time,
    waveIndex,
    strength
) {

    const wavelengths = [
        45,
        38,
        32
    ];

    const amplitudes = [
        1.00,
        0.72,
        0.45
    ];

    const velocities = [
        0.063,
        0.067,
        0.071
    ];


    const wavelength =
        wavelengths[waveIndex];

    const amplitude =
        amplitudes[waveIndex];

    const velocity =
        velocities[waveIndex];


    const k =
        (Math.PI * 2) /
        wavelength;


    const front =
        time * velocity;


    const phase =
        k *
        (
            radius -
            front
        );


    const packet =
        Math.exp(
            -Math.pow(
                (radius - front) /
                18,
                2
            )
        );


    const spreading =
        1 /
        Math.sqrt(
            1 +
            radius * 0.022
        );


    const damping =
        Math.exp(
            -time * 0.00062
        );


    return (
        Math.sin(phase) *
        amplitude *
        (
            0.25 +
            packet * 1.35
        ) *
        spreading *
        damping *
        strength
    );
}


/* =========================================================
   TOTAL WATER HEIGHT
   ========================================================= */

function getWaterHeight(
    radius,
    time,
    effect
) {

    let result = 0;

    for (
        let i = 0;
        i < WAVE_COUNT;
        i++
    ) {

        result +=
            waterDisplacement(
                radius,
                time,
                i,
                effect.strength
            );
    }

    result *=
        Math.exp(
            -radius * 0.0022
        );

    return result;
}


/* =========================================================
   WATER SLOPE
   ========================================================= */

function getWaterSlope(
    radius,
    time,
    effect
) {

    const d = 1.2;

    const left =
        getWaterHeight(
            Math.max(
                0,
                radius - d
            ),
            time,
            effect
        );

    const right =
        getWaterHeight(
            radius + d,
            time,
            effect
        );

    return (
        right - left
    ) / (
        d * 2
    );
}


/* =========================================================
   INITIAL IMPACT BASIN (VIVID & BRIGHT)
   ========================================================= */

function drawInitialImpact(
    effect
) {

    const life =
        Math.exp(
            -effect.age * 0.002
        );

    if (
        life < 0.01 ||
        effect.age >= WATER_LIFETIME
    ) {
        return;
    }

    const fadeOut =
        1 -
        smoothstep(
            WATER_LIFETIME * 0.65,
            WATER_LIFETIME,
            effect.age
        );

    const alpha = life * fadeOut * 0.92;

    const cavityRadius =
        16 +
        Math.sin(effect.age * 0.007) * 3.5;

    const poolGrad =
        ctx.createRadialGradient(
            effect.x,
            effect.y,
            0,
            effect.x,
            effect.y,
            cavityRadius * 2.6
        );

    poolGrad.addColorStop(
        0,
        `rgba(4, 18, 38, ${alpha * 0.95})`
    );
    poolGrad.addColorStop(
        0.35,
        `rgba(20, 75, 130, ${alpha * 0.8})`
    );
    poolGrad.addColorStop(
        0.58,
        `rgba(130, 215, 255, ${alpha * 0.85})`
    );
    poolGrad.addColorStop(
        0.82,
        `rgba(15, 55, 100, ${alpha * 0.6})`
    );
    poolGrad.addColorStop(
        1,
        "rgba(0, 0, 0, 0)"
    );

    ctx.save();
    ctx.fillStyle = poolGrad;
    ctx.beginPath();
    ctx.arc(
        effect.x,
        effect.y,
        cavityRadius * 2.6,
        0,
        Math.PI * 2
    );
    ctx.fill();
    ctx.restore();
}


/* =========================================================
   DRAW VIVID, CLEAN WATER WAVE[cite: 1]
   ========================================================= */

function drawWaterWave(
    effect,
    waveIndex
) {

    const leadingFront =
        effect.age *
        WAVE_SPEED;

    const radius =
        leadingFront -
        waveIndex * WAVE_DISTANCE;


    if (
        radius < 4 ||
        radius > WATER_RADIUS
    ) {
        return;
    }


    const ageFade =
        Math.exp(
            -effect.age * 0.00038
        ) *
        (1 - smoothstep(WATER_LIFETIME * 0.75, WATER_LIFETIME, effect.age));


    const radiusFade =
        1 -
        smoothstep(
            WATER_RADIUS - 18,
            WATER_RADIUS,
            radius
        );


    const waveStrength =
        [
            1.00,
            0.75,
            0.50
        ][waveIndex];


    const visibility =
        ageFade *
        radiusFade *
        waveStrength *
        0.98;


    if (
        visibility < 0.005
    ) {
        return;
    }


    const height =
        getWaterHeight(
            radius,
            effect.age,
            effect
        );

    const slope =
        Math.abs(
            getWaterSlope(
                radius,
                effect.age,
                effect
            )
        );

    const highlight =
        clamp(
            slope * 5.2,
            0,
            1
        );

    const bandWidth =
        clamp(
            8.0 + radius * 0.05 - waveIndex * 0.6,
            6.0,
            14.0
        );


    /* ======================================================
       1. VIVID 3D VOLUMETRIC RING SHADING
       ====================================================== */

    const innerR = Math.max(0.5, radius - bandWidth * 0.75);
    const outerR = radius + bandWidth * 0.75;

    const ringGrad =
        ctx.createRadialGradient(
            effect.x,
            effect.y,
            innerR,
            effect.x,
            effect.y,
            outerR
        );

    ringGrad.addColorStop(
        0.0,
        "rgba(2, 10, 24, 0)"
    );
    ringGrad.addColorStop(
        0.25,
        `rgba(4, 18, 38, ${visibility * 0.92})`
    );
    ringGrad.addColorStop(
        0.50,
        `rgba(45, 130, 205, ${visibility * 0.65})`
    );
    ringGrad.addColorStop(
        0.72,
        `rgba(220, 248, 255, ${visibility * (0.65 + highlight * 0.35)})`
    );
    ringGrad.addColorStop(
        0.88,
        `rgba(8, 32, 65, ${visibility * 0.82})`
    );
    ringGrad.addColorStop(
        1.0,
        "rgba(2, 10, 24, 0)"
    );

    ctx.save();
    ctx.beginPath();
    ctx.arc(
        effect.x,
        effect.y,
        outerR,
        0,
        Math.PI * 2
    );
    ctx.arc(
        effect.x,
        effect.y,
        innerR,
        0,
        Math.PI * 2,
        true
    );
    ctx.fillStyle = ringGrad;
    ctx.fill();
    ctx.restore();


    /* ======================================================
       2. CLEAN REFRACTIVE CRESCENTS & SPECULAR ARCS[cite: 1]
       ====================================================== */

    const segments = 90;
    const stepAngle = (Math.PI * 2) / segments;

    for (let i = 0; i < segments; i++) {
        const a0 = i * stepAngle;
        const a1 = (i + 1.08) * stepAngle;
        const midAngle = (a0 + a1) * 0.5;

        const d = effect.distortion[i % effect.distortion.length];

        const organic =
            d.strength *
            Math.sin(
                d.phase +
                effect.age * 0.0022 +
                midAngle * d.frequency
            );

        const localR = radius + organic + height * 2.0;

        const lightAlignment = Math.cos(midAngle - LIGHT_ANGLE);
        const crescentMask = Math.pow(Math.abs(lightAlignment), 0.7);
        const troughStrength = visibility * crescentMask;

        if (troughStrength > 0.03) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(
                effect.x,
                effect.y,
                localR - bandWidth * 0.2,
                a0,
                a1
            );
            ctx.strokeStyle =
                `rgba(1, 6, 15, ${clamp(troughStrength * 0.95, 0, 0.95)})`;
            ctx.lineWidth =
                (1.2 + crescentMask * 2.2) * waveStrength;
            ctx.lineCap = "round";
            ctx.stroke();
            ctx.restore();
        }

        const specAlignment = Math.max(0, Math.cos(midAngle - LIGHT_ANGLE));
        const backSpec = Math.max(0, -Math.cos(midAngle - LIGHT_ANGLE)) * 0.7;
        const specIntensity =
            visibility *
            (Math.pow(specAlignment, 1.8) + Math.pow(backSpec, 2.2)) *
            (0.6 + highlight * 0.5);

        if (specIntensity > 0.02) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(
                effect.x,
                effect.y,
                localR + bandWidth * 0.16,
                a0,
                a1
            );
            ctx.strokeStyle =
                `rgba(240, 252, 255, ${clamp(specIntensity * 0.98, 0, 0.98)})`;
            ctx.lineWidth =
                1.0 + specIntensity * 1.6;
            ctx.lineCap = "round";
            ctx.stroke();
            ctx.restore();
        }
    }
}


/* =========================================================
   POST-ELECTRIC SHOCK
   ========================================================= */

function drawPostElectricShock(
    effect
) {

    if (
        !effect.shockStarted
    ) {
        return;
    }


    const progress =
        effect.shockAge /
        SHOCK_DURATION;


    if (
        progress >= 1
    ) {
        return;
    }


    const intensity =
        Math.pow(
            1 - progress,
            0.42
        );


    const radius =
        WATER_RADIUS;


    if (
        progress < 0.20
    ) {

        const flash =
            1 -
            progress / 0.20;


        ctx.save();


        ctx.beginPath();

        ctx.arc(
            effect.x,
            effect.y,
            radius,
            0,
            Math.PI * 2
        );


        ctx.strokeStyle =
            `rgba(
                240,
                254,
                255,
                ${flash * 0.85}
            )`;


        ctx.lineWidth = 5 + flash * 5;


        ctx.shadowBlur = 30 + flash * 25;


        ctx.shadowColor =
            `rgba(
                40,
                220,
                255,
                ${flash}
            )`;


        ctx.stroke();


        ctx.restore();
    }


    ctx.save();

    ctx.beginPath();

    ctx.arc(
        effect.x,
        effect.y,
        radius,
        0,
        Math.PI * 2
    );


    ctx.strokeStyle =
        `rgba(
            30,
            210,
            255,
            ${intensity * 0.5}
        )`;


    ctx.lineWidth = 6;


    ctx.shadowBlur = 25;


    ctx.shadowColor =
        `rgba(
            25,
            200,
            255,
            ${intensity}
        )`;


    ctx.stroke();


    ctx.restore();


    const movingAngle =
        effect.shockOrigin +
        performance.now() *
        0.0038;


    const arcCount = 22;


    for (
        let i = 0;
        i < arcCount;
        i++
    ) {

        const angle =
            movingAngle +
            (
                i /
                arcCount
            ) *
            Math.PI * 2;


        if (
            Math.random() > 0.52
        ) {
            continue;
        }


        const arcSize =
            random(
                0.08,
                0.20
            );


        let a =
            angle;


        let r =
            radius +
            random(
                -3,
                3
            );


        let x =
            effect.x +
            Math.cos(a) *
            r;


        let y =
            effect.y +
            Math.sin(a) *
            r;


        ctx.beginPath();

        ctx.moveTo(
            x,
            y
        );


        const steps = 8;


        for (
            let j = 0;
            j < steps;
            j++
        ) {

            a +=
                arcSize /
                steps;


            r =
                radius +
                random(
                    -8,
                    8
                );


            x =
                effect.x +
                Math.cos(a) *
                r;


            y =
                effect.y +
                Math.sin(a) *
                r;


            x += random(-3, 3);
            y += random(-3, 3);


            ctx.lineTo(
                x,
                y
            );
        }


        ctx.save();


        ctx.strokeStyle =
            `rgba(
                245,
                255,
                255,
                ${intensity}
            )`;


        ctx.lineWidth = random(1.5, 2.8);


        ctx.shadowBlur = 22;


        ctx.shadowColor =
            `rgba(
                35,
                220,
                255,
                ${intensity}
            )`;


        ctx.stroke();


        ctx.restore();
    }


    for (
        let i = 0;
        i < 28;
        i++
    ) {

        const angle =
            random(
                0,
                Math.PI * 2
            );


        const distance =
            radius +
            random(
                -3,
                14
            );


        const x =
            effect.x +
            Math.cos(angle) *
            distance;


        const y =
            effect.y +
            Math.sin(angle) *
            distance;


        const size =
            random(
                1.0,
                3.5
            );


        ctx.save();


        ctx.beginPath();


        ctx.arc(
            x,
            y,
            size,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            `rgba(
                245,
                255,
                255,
                ${intensity}
            )`;


        ctx.shadowBlur = 20;


        ctx.shadowColor =
            `rgba(
                35,
                220,
                255,
                ${intensity}
            )`;


        ctx.fill();

        ctx.restore();
    }
}


/* =========================================================
   MAIN ANIMATION
   ========================================================= */

let previous =
    performance.now();


function animate(now) {

    const delta =
        now -
        previous;


    previous =
        now;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    for (
        let i = effects.length - 1;
        i >= 0;
        i--
    ) {

        const effect =
            effects[i];


        effect.age +=
            delta;


        drawInitialImpact(
            effect
        );


        if (
            effect.age <
            WATER_LIFETIME
        ) {

            for (
                let wave = 0;
                wave < WAVE_COUNT;
                wave++
            ) {

                drawWaterWave(
                    effect,
                    wave
                );
            }
        }


        const shockStart =
            WATER_LIFETIME +
            SHOCK_DELAY;


        if (
            !effect.shockStarted &&
            effect.age >=
            shockStart
        ) {

            effect.shockStarted =
                true;

            effect.shockAge =
                0;


            effect.shockOrigin =
                Math.random() *
                Math.PI *
                2;
        }


        if (
            effect.shockStarted
        ) {

            effect.shockAge +=
                delta;


            drawPostElectricShock(
                effect
            );
        }


        if (
            effect.shockStarted &&
            effect.shockAge >=
            SHOCK_DURATION
        ) {

            effects.splice(
                i,
                1
            );
        }
    }


    requestAnimationFrame(
        animate
    );
}


requestAnimationFrame(
    animate
);

</script>

</body>
</html>
