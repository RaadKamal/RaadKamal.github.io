<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Water Ripple + Delayed Electric Shock</title>

<style>
    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;

        /*
         * NORMAL WINDOWS MOUSE
         */
        cursor: default;

        /*
         * Dark subtle background.
         */
        background:
            radial-gradient(
                circle at 50% 50%,
                #18212a 0%,
                #0b1016 45%,
                #030507 100%
            );
    }

    canvas {
        position: fixed;
        inset: 0;

        width: 100%;
        height: 100%;

        pointer-events: none;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

/* =========================================================
   CANVAS SETUP
   ========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let width = 0;
let height = 0;
let dpr = 1;


/* =========================================================
   ACTIVE EFFECTS
   ========================================================= */

const effects = [];


/* =========================================================
   WATER SETTINGS
   ========================================================= */

/*
 * Small localized radius.
 */
const WATER_RADIUS = 105;


/*
 * SLOW water wave.

 * The first wave takes roughly:
 *
 *   105 / 0.072 ≈ 1458 ms
 *
 * to reach the perimeter.
 */
const WAVE_SPEED = 0.072;


/*
 * Exactly THREE water waves.
 */
const WAVE_COUNT = 3;


/*
 * Distance between the wave crests.
 */
const WAVE_DISTANCE = 25;


/*
 * Water remains naturally visible for
 * roughly 2.3 seconds.
 */
const WATER_LIFETIME = 2300;


/*
 * IMPORTANT:

 * Once the water is COMPLETELY gone,
 * wait another 1.8 seconds before
 * the electrical event.
 */
const SHOCK_DELAY = 1800;


/*
 * Electric event duration.
 */
const SHOCK_DURATION = 850;


/* =========================================================
   RESIZE
   ========================================================= */

function resize() {

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    width =
        window.innerWidth;

    height =
        window.innerHeight;


    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   HELPERS
   ========================================================= */

function random(min, max) {

    return (
        Math.random() *
        (max - min) +
        min
    );
}


function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );
}


function smoothstep(
    a,
    b,
    x
) {

    const t =
        clamp(
            (x - a) /
            (b - a),
            0,
            1
        );

    return (
        t *
        t *
        (3 - 2 * t)
    );
}


/* =========================================================
   MOUSE CLICK
   ========================================================= */

window.addEventListener(
    "mousedown",
    function(event) {

        createEffect(
            event.clientX,
            event.clientY
        );

    }
);


/* =========================================================
   CREATE WATER EVENT
   ========================================================= */

function createEffect(
    x,
    y
) {

    const effect = {

        x,
        y,

        /*
         * Time elapsed since click.
         */
        age: 0,

        /*
         * Slight random energy variation.
         */
        strength:
            random(
                0.92,
                1.08
            ),

        /*
         * Organic imperfections in the
         * circular water surface.
         */
        distortion: [],

        /*
         * Delayed shock state.
         */
        shockStarted: false,

        shockAge: 0,

        /*
         * Starting position of electrical
         * activity around perimeter.
         */
        shockOrigin:
            random(
                0,
                Math.PI * 2
            )
    };


    /*
     * Generate subtle water irregularities.
     */
    for (
        let i = 0;
        i < 240;
        i++
    ) {

        effect.distortion.push({

            phase:
                random(
                    0,
                    Math.PI * 2
                ),

            strength:
                random(
                    0.25,
                    1.5
                ),

            frequency:
                random(
                    1.0,
                    3.0
                )
        });
    }


    effects.push(effect);


    /*
     * Prevent excessive simultaneous effects.
     */
    while (
        effects.length > 5
    ) {

        effects.shift();

    }
}


/* =========================================================
   WATER WAVE PHYSICS
   ========================================================= */

/*
 * A damped outward-moving water wave.

 *
 * We approximate:
 *
 *     A(r,t) sin(k(r-vt))
 *
 * with:
 *
 * - radial spreading
 * - damping
 * - localized wave packet
 * - three different wave modes
 *
 * This produces broad crests and troughs instead
 * of simple glowing circles.
 */

function waterDisplacement(
    radius,
    time,
    waveIndex,
    strength
) {

    /*
     * Large wavelengths give broad,
     * recognizable water ripples.
     */
    const wavelengths = [
        47,
        43,
        39
    ];


    /*
     * Successive waves are weaker.
     */
    const amplitudes = [
        1.00,
        0.58,
        0.30
    ];


    /*
     * Slight dispersion between waves.
     */
    const velocities = [
        0.063,
        0.067,
        0.071
    ];


    const wavelength =
        wavelengths[waveIndex];

    const amplitude =
        amplitudes[waveIndex];

    const velocity =
        velocities[waveIndex];


    const k =
        (Math.PI * 2) /
        wavelength;


    /*
     * Current leading edge.
     */
    const front =
        time * velocity;


    /*
     * Outward travelling wave.
     */
    const phase =
        k *
        (
            radius -
            front
        );


    /*
     * Local wave packet.
     */
    const packet =
        Math.exp(
            -Math.pow(
                (radius - front) /
                18,
                2
            )
        );


    /*
     * Circular geometric spreading.

     * As circumference grows, energy spreads out.
     */
    const spreading =
        1 /
        Math.sqrt(
            1 +
            radius * 0.025
        );


    /*
     * Slow energy loss.
     */
    const damping =
        Math.exp(
            -time * 0.00068
        );


    /*
     * The packet makes each crest feel
     * localized rather than infinite.
     */
    return (
        Math.sin(phase) *
        amplitude *
        (
            0.22 +
            packet * 1.25
        ) *
        spreading *
        damping *
        strength
    );
}


/* =========================================================
   TOTAL WATER HEIGHT
   ========================================================= */

function getWaterHeight(
    radius,
    time,
    effect
) {

    let result = 0;


    /*
     * Superposition of the three waves.
     */
    for (
        let i = 0;
        i < WAVE_COUNT;
        i++
    ) {

        result +=
            waterDisplacement(
                radius,
                time,
                i,
                effect.strength
            );
    }


    /*
     * Extra radial energy falloff.
     */
    result *=
        Math.exp(
            -radius * 0.0025
        );


    return result;
}


/* =========================================================
   WATER SLOPE
   ========================================================= */

function getWaterSlope(
    radius,
    time,
    effect
) {

    const d =
        1.3;


    const left =
        getWaterHeight(
            Math.max(
                0,
                radius - d
            ),
            time,
            effect
        );


    const right =
        getWaterHeight(
            radius + d,
            time,
            effect
        );


    return (
        right - left
    ) / (
        d * 2
    );
}


/* =========================================================
   INITIAL IMPACT
   ========================================================= */

function drawInitialImpact(
    effect
) {

    /*
     * Strong at beginning and quickly settles.
     */
    const life =
        Math.exp(
            -effect.age * 0.011
        );


    if (
        life < 0.01
    ) {
        return;
    }


    const radius =
        3 +
        effect.age * 0.012;


    /*
     * Soft light on the initial water depression.
     */
    const gradient =
        ctx.createRadialGradient(
            effect.x,
            effect.y,
            0,
            effect.x,
            effect.y,
            radius * 5
        );


    gradient.addColorStop(
        0,

        `rgba(
            230,
            244,
            247,
            ${life * 0.48}
        )`
    );


    gradient.addColorStop(
        0.4,

        `rgba(
            130,
            175,
            185,
            ${life * 0.12}
        )`
    );


    gradient.addColorStop(
        1,

        "rgba(0,0,0,0)"
    );


    ctx.save();

    ctx.fillStyle =
        gradient;


    ctx.beginPath();

    ctx.arc(
        effect.x,
        effect.y,
        radius * 5,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();
}


/* =========================================================
   SMALL WATER DROPLETS
   ========================================================= */

function drawWaterDroplets(
    effect
) {

    /*
     * Only during the initial impact.
     */
    if (
        effect.age > 320
    ) {
        return;
    }


    const life =
        1 -
        effect.age / 320;


    /*
     * Keep this very restrained.
     */
    for (
        let i = 0;
        i < 7;
        i++
    ) {

        const angle =
            (
                i / 7
            ) *
            Math.PI * 2;


        const distance =
            6 +
            effect.age * 0.024;


        const x =
            effect.x +
            Math.cos(angle) *
            distance;


        const y =
            effect.y +
            Math.sin(angle) *
            distance;


        ctx.save();

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            random(
                0.5,
                1.4
            ),
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            `rgba(
                210,
                235,
                240,
                ${life * 0.32}
            )`;


        ctx.fill();

        ctx.restore();
    }
}


/* =========================================================
   DRAW ONE WATER WAVE
   ========================================================= */

function drawWaterWave(
    effect,
    waveIndex
) {

    /*
     * Position of the outermost wave.
     */
    const leadingFront =
        effect.age *
        WAVE_SPEED;


    /*
     * Position each of the three waves.
     */
    const radius =
        leadingFront -
        waveIndex * WAVE_DISTANCE;


    if (
        radius < 4 ||
        radius > WATER_RADIUS
    ) {
        return;
    }


    /*
     * Water slowly loses intensity.
     */
    const ageFade =
        Math.exp(
            -effect.age * 0.00033
        );


    /*
     * Fade as it approaches the maximum radius.
     */
    const radiusFade =
        1 -
        smoothstep(
            WATER_RADIUS - 12,
            WATER_RADIUS + 4,
            radius
        );


    /*
     * Three visible amplitudes.
     */
    const waveStrength =
        [
            1.00,
            0.62,
            0.35
        ][waveIndex];


    const visibility =
        ageFade *
        radiusFade *
        waveStrength;


    if (
        visibility < 0.005
    ) {
        return;
    }


    /*
     * Actual water surface displacement.
     */
    const height =
        getWaterHeight(
            radius,
            effect.age,
            effect
        );


    /*
     * Surface slope.

     * A steep crest catches more reflected light.
     */
    const slope =
        Math.abs(
            getWaterSlope(
                radius,
                effect.age,
                effect
            )
        );


    const highlight =
        clamp(
            slope * 4.0,
            0,
            1
        );


    /* ======================================================
       WATER CONTOUR
       ====================================================== */

    const points = 260;

    ctx.beginPath();


    for (
        let i = 0;
        i <= points;
        i++
    ) {

        const t =
            i / points;


        const angle =
            t *
            Math.PI * 2;


        const d =
            effect.distortion[
                i %
                effect.distortion.length
            ];


        /*
         * Very subtle natural distortion.

         * This keeps the wave organic while preserving
         * its actual circular propagation.
         */
        const organic =
            d.strength *
            Math.sin(
                d.phase +
                effect.age * 0.0012 +
                angle * d.frequency
            );


        /*
         * Actual crest/trough displacement.
         */
        const radialWave =
            height * 6.5;


        const r =
            radius +
            organic +
            radialWave;


        const x =
            effect.x +
            Math.cos(angle) * r;


        const y =
            effect.y +
            Math.sin(angle) * r;


        if (
            i === 0
        ) {

            ctx.moveTo(
                x,
                y
            );

        } else {

            ctx.lineTo(
                x,
                y
            );

        }
    }


    ctx.closePath();


    /* ======================================================
       DARK SIDE / TROUGH
       ====================================================== */

    ctx.save();

    ctx.strokeStyle =
        `rgba(
            22,
            59,
            72,
            ${visibility * 0.9}
        )`;


    ctx.lineWidth =
        1.35;


    ctx.shadowBlur = 0;

    ctx.stroke();

    ctx.restore();


    /* ======================================================
       BRIGHT WATER CREST
       ====================================================== */

    ctx.save();


    /*
     * This is a water reflection,
     * NOT an electric/neon glow.
     */
    ctx.strokeStyle =
        `rgba(
            220,
            237,
            239,
            ${visibility *
              (
                  0.32 +
                  highlight * 0.75
              )}
        )`;


    ctx.lineWidth =
        1.0 +
        highlight * 1.15;


    ctx.shadowBlur = 0;


    ctx.stroke();

    ctx.restore();


    /* ======================================================
       SOFT INNER REFLECTION
       ====================================================== */

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        effect.x,
        effect.y,
        radius - 2.8,
        0,
        Math.PI * 2
    );


    ctx.strokeStyle =
        `rgba(
            150,
            198,
            207,
            ${visibility * 0.20}
        )`;


    ctx.lineWidth = 2;

    ctx.filter =
        "blur(1px)";

    ctx.stroke();

    ctx.restore();


    /* ======================================================
       OUTER DARK TROUGH
       ====================================================== */

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        effect.x,
        effect.y,
        radius + 3.2,
        0,
        Math.PI * 2
    );


    ctx.strokeStyle =
        `rgba(
            8,
            27,
            37,
            ${visibility * 0.60}
        )`;


    ctx.lineWidth = 1;

    ctx.filter = "none";

    ctx.stroke();

    ctx.restore();
}


/* =========================================================
   POST-ELECTRIC SHOCK
   ========================================================= */

/*
 * IMPORTANT:

 * This function is NOT called while the water is moving.

 * The water completely disappears first.

 * Then there is a long period of silence.

 * THEN this event happens.

 * The shock uses the former water radius.
 */

function drawPostElectricShock(
    effect
) {

    if (
        !effect.shockStarted
    ) {
        return;
    }


    const progress =
        effect.shockAge /
        SHOCK_DURATION;


    if (
        progress >= 1
    ) {
        return;
    }


    /*
     * Strong and obvious at the start.
     */
    const intensity =
        Math.pow(
            1 - progress,
            0.42
        );


    const radius =
        WATER_RADIUS;


    /* ======================================================
       INITIAL ELECTRICAL FLASH
       ====================================================== */

    if (
        progress < 0.20
    ) {

        const flash =
            1 -
            progress / 0.20;


        ctx.save();


        ctx.beginPath();

        ctx.arc(
            effect.x,
            effect.y,
            radius,
            0,
            Math.PI * 2
        );


        ctx.strokeStyle =
            `rgba(
                235,
                252,
                255,
                ${flash * 0.62}
            )`;


        ctx.lineWidth =
            4 +
            flash * 4;


        ctx.shadowBlur =
            25 +
            flash * 25;


        ctx.shadowColor =
            `rgba(
                30,
                210,
                255,
                ${flash}
            )`;


        ctx.stroke();


        ctx.restore();
    }


    /* ======================================================
       OUTER ELECTRIC AURA
       ====================================================== */

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        effect.x,
        effect.y,
        radius,
        0,
        Math.PI * 2
    );


    ctx.strokeStyle =
        `rgba(
            20,
            200,
            255,
            ${intensity * 0.30}
        )`;


    ctx.lineWidth =
        5 +
        intensity * 4;


    ctx.shadowBlur =
        22 +
        intensity * 20;


    ctx.shadowColor =
        `rgba(
            20,
            190,
            255,
            ${intensity}
        )`;


    ctx.stroke();


    ctx.restore();


    /* ======================================================
       MOVING ELECTRIC ARCS
       ====================================================== */

    /*
     * The arcs move around the perimeter.
     */
    const movingAngle =
        effect.shockOrigin +
        performance.now() *
        0.0038;


    const arcCount = 18;


    for (
        let i = 0;
        i < arcCount;
        i++
    ) {

        const angle =
            movingAngle +
            (
                i /
                arcCount
            ) *
            Math.PI * 2;


        /*
         * Gaps make the shock feel like actual
         * electrical discharge instead of a ring.
         */
        if (
            Math.random() > 0.57
        ) {
            continue;
        }


        /*
         * Length of this lightning section.
         */
        const arcSize =
            random(
                0.07,
                0.19
            );


        let a =
            angle;


        let r =
            radius +
            random(
                -3,
                3
            );


        let x =
            effect.x +
            Math.cos(a) *
            r;


        let y =
            effect.y +
            Math.sin(a) *
            r;


        ctx.beginPath();

        ctx.moveTo(
            x,
            y
        );


        /*
         * Jagged lightning path.
         */
        const steps = 8;


        for (
            let j = 0;
            j < steps;
            j++
        ) {

            a +=
                arcSize /
                steps;


            r =
                radius +
                random(
                    -9,
                    9
                );


            x =
                effect.x +
                Math.cos(a) *
                r;


            y =
                effect.y +
                Math.sin(a) *
                r;


            /*
             * Sharp radial jitter.
             */
            x += random(-3, 3);
            y += random(-3, 3);


            ctx.lineTo(
                x,
                y
            );
        }


        /* ==================================================
           BRIGHT CORE
           ================================================== */

        ctx.save();


        ctx.strokeStyle =
            `rgba(
                245,
                255,
                255,
                ${intensity *
                  random(
                      0.70,
                      1
                  )}
            )`;


        ctx.lineWidth =
            random(
                1.2,
                2.5
            );


        ctx.shadowBlur =
            18 +
            intensity * 18;


        ctx.shadowColor =
            `rgba(
                25,
                210,
                255,
                ${intensity}
            )`;


        ctx.stroke();


        ctx.restore();


        /* ==================================================
           WIDER ELECTRIC GLOW
           ================================================== */

        /*
         * Draw a broader low-opacity stroke underneath.
         */
        ctx.save();


        ctx.beginPath();


        /*
         * Reconstruct approximate arc as a simple glow.
         */
        ctx.arc(
            effect.x,
            effect.y,
            radius + random(-1, 1),
            angle,
            angle + arcSize
        );


        ctx.strokeStyle =
            `rgba(
                20,
                180,
                255,
                ${intensity * 0.32}
            )`;


        ctx.lineWidth =
            random(
                3,
                5
            );


        ctx.shadowBlur = 20;


        ctx.shadowColor =
            `rgba(
                10,
                190,
                255,
                ${intensity}
            )`;


        ctx.stroke();


        ctx.restore();
    }


    /* ======================================================
       BRIGHT SPARKS
       ====================================================== */

    for (
        let i = 0;
        i < 24;
        i++
    ) {

        const angle =
            random(
                0,
                Math.PI * 2
            );


        /*
         * Sparks remain close to the perimeter.
         */
        const distance =
            radius +
            random(
                -3,
                13
            );


        const x =
            effect.x +
            Math.cos(angle) *
            distance;


        const y =
            effect.y +
            Math.sin(angle) *
            distance;


        const size =
            random(
                0.8,
                3.5
            );


        ctx.save();


        ctx.beginPath();


        ctx.arc(
            x,
            y,
            size,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            `rgba(
                245,
                255,
                255,
                ${intensity}
            )`;


        ctx.shadowBlur =
            20;


        ctx.shadowColor =
            `rgba(
                30,
                215,
                255,
                ${intensity}
            )`;


        ctx.fill();


        /*
         * Some sparks shoot a tiny distance outward.
         */
        if (
            Math.random() > 0.48
        ) {

            ctx.beginPath();

            ctx.moveTo(
                x,
                y
            );


            ctx.lineTo(
                x + random(-8, 8),
                y + random(-8, 8)
            );


            ctx.strokeStyle =
                `rgba(
                    180,
                    240,
                    255,
                    ${intensity * 0.90}
                )`;


            ctx.lineWidth = 1.2;


            ctx.shadowBlur = 12;


            ctx.stroke();
        }


        ctx.restore();
    }
}


/* =========================================================
   MAIN ANIMATION
   ========================================================= */

let previous =
    performance.now();


function animate(now) {

    const delta =
        now -
        previous;


    previous =
        now;


    /*
     * Fully clear the canvas every frame.

     * No unwanted full-screen trails.
     */
    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    for (
        let i = effects.length - 1;
        i >= 0;
        i--
    ) {

        const effect =
            effects[i];


        effect.age +=
            delta;


        /* =================================================
           PHASE 1:
           INITIAL WATER IMPACT
           ================================================= */

        drawInitialImpact(
            effect
        );


        drawWaterDroplets(
            effect
        );


        /* =================================================
           PHASE 2:
           THREE SLOW WATER WAVES
           ================================================= */

        if (
            effect.age <
            WATER_LIFETIME
        ) {

            for (
                let wave = 0;
                wave < WAVE_COUNT;
                wave++
            ) {

                drawWaterWave(
                    effect,
                    wave
                );
            }
        }


        /* =================================================
           PHASE 3:
           LONG SILENT DELAY
           ================================================= */

        /*
         * There is deliberately NOTHING drawn here.

         * This gives the effect its:
         *
         *     water
         *       ↓
         *     fade away
         *       ↓
         *     silence
         *       ↓
         *     shock
         *
         * character.
         */

        const shockStart =
            WATER_LIFETIME +
            SHOCK_DELAY;


        /* =================================================
           PHASE 4:
           DELAYED ELECTRIC SHOCK
           ================================================= */

        if (
            !effect.shockStarted &&
            effect.age >=
            shockStart
        ) {

            effect.shockStarted =
                true;

            effect.shockAge =
                0;


            /*
             * Random starting point around
             * the old water perimeter.
             */
            effect.shockOrigin =
                Math.random() *
                Math.PI *
                2;
        }


        if (
            effect.shockStarted
        ) {

            effect.shockAge +=
                delta;


            drawPostElectricShock(
                effect
            );
        }


        /* =================================================
           PHASE 5:
           CLEANUP
           ================================================= */

        if (
            effect.shockStarted &&
            effect.shockAge >=
            SHOCK_DURATION
        ) {

            effects.splice(
                i,
                1
            );
        }
    }


    requestAnimationFrame(
        animate
    );
}
